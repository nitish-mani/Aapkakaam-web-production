server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ---- Compression ---------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain text/css text/xml application/xml application/xml+rss
        application/javascript application/x-javascript application/json
        image/svg+xml application/vnd.ms-fontobject application/x-font-ttf
        font/opentype;

    # ---- Security headers ---------------------------------------------
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # ---- Long-cache immutable assets ----------------------------------
    location ~* \.(?:js|css|woff2?|ttf|otf|eot|svg|png|jpg|jpeg|gif|webp|avif|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ---- Optional: reverse-proxy /api to your backend -----------------
    # Uncomment and adjust when the frontend and backend are served from
    # the same origin (avoids CORS entirely).
    #
    # location /api/ {
    #     proxy_pass         http://api:3000/api/;
    #     proxy_http_version 1.1;
    #     proxy_set_header   Host              $host;
    #     proxy_set_header   X-Real-IP         $remote_addr;
    #     proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    #     proxy_set_header   X-Forwarded-Proto $scheme;
    # }

    # ---- SPA fallback -------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Never cache the entry document; every deploy replaces hashed assets
    # referenced from it.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }
}
