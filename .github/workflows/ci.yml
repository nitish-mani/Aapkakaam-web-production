name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint + Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ["18", "20"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: yarn
      - run: yarn install --frozen-lockfile
      - name: Lint
        run: yarn lint
      - name: Build (test that production build succeeds)
        env:
          VITE_API_URL: https://api.example.com/api
        run: yarn build

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: aapkakaam-web:ci-${{ github.sha }}
          build-args: |
            VITE_API_URL=https://api.example.com/api
          cache-from: type=gha
          cache-to: type=gha,mode=max
